name: ngo_app
description: NGO Fellow & Volunteer Management App
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.5.0
  flutter_secure_storage: ^9.2.2
  easy_localization: ^3.0.7
  cupertino_icons: ^1.0.8
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  intl: ^0.20.3

dev_dependencies:
  shared_preferences: ^2.5.3
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf
  assets:
    - assets/translations/
