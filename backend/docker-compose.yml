services:
  minio:
    image: ngo-app-minio-local:2025-10-15
    build:
      context: .
      dockerfile: Dockerfile.minio
    profiles: [storage]
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ngo-local
      MINIO_ROOT_PASSWORD: ngo-local-storage-only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ngo_app_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: ngo-app-minio-local:2025-10-15
    profiles: [storage]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 ngo-local ngo-local-storage-only &&
      mc mb --ignore-existing local/ngo-private && mc anonymous set none local/ngo-private"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ngo_app
      POSTGRES_PASSWORD: ngo_app
      POSTGRES_DB: ngo_app
    ports:
      - "5432:5432"
    volumes:
      - ngo_app_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngo_app"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://ngo_app:ngo_app@db:5432/ngo_app
    depends_on:
      db:
        condition: service_healthy

volumes:
  ngo_app_postgres_data:
  ngo_app_minio_data:
