services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ngo_app
      POSTGRES_PASSWORD: ngo_app
      POSTGRES_DB: ngo_app
    ports:
      - "5432:5432"
    volumes:
      - ngo_app_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngo_app"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://ngo_app:ngo_app@db:5432/ngo_app
    depends_on:
      db:
        condition: service_healthy

volumes:
  ngo_app_postgres_data:
